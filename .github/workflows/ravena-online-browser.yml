name: Ravena Online - browser smoke

on:
  pull_request:
    paths:
      - "ravena-online/**"
      - ".github/workflows/ravena-online-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright locally for smoke testing
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install chromium
      - name: Start local static preview
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/ravena-http.log 2>&1 &
          sleep 2
      - name: Validate desktop and mobile gameplay startup
        run: node ravena-online/browser-smoke.mjs
