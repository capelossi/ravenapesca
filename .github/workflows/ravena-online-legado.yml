name: Ravena Online - legado arte e santuário

on:
  pull_request:
    paths:
      - "ravena-online/**"
      - ".github/workflows/ravena-online-legado.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temple-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser dependencies
        run: npm install --no-save --no-package-lock playwright@1.56.1 babylonjs@8
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Start local static preview
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/ravena-http.log 2>&1 &
          sleep 2
      - name: Exercise original art, temple portal, altar and save
        run: node ravena-online/legacy-browser-smoke.mjs
